<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Outer Main Start -->
    <main>
        <!-- Inner Main start -->
        <div id="main">
            <!-- game-screen start -->
            <div id="game-screen">
                <!-- game-screen-top start -->
                <div id="game-screen-top">
                    <!-- elem start -->
                    <div class="elem">
                        <h2>Hit</h2>
                        <div id="hitvalue" class="box"></div>
                    </div>
                    <div class="elem">
                        <h2>Score</h2>
                        <div id="scorevalue" class="box">0</div>                        
                    </div>
                    <div class="elem">
                        <h2>Timer</h2>
                        <div id="timervalue" class="box"></div>                        
                    </div>
                    <!-- elem end -->
                </div>
                <!-- game-screen-top end -->
                 <!-- game-screen-bottom start-->
                 <div id="game-screen-bottom">
                    
                 </div>
                 <!-- game-screen-bottom end -->
            </div>
            <!-- game-screen end -->
        </div>
        <!-- inner Main end -->
    </main>
    <!-- Outer Main end -->
    <!-- ------------ -->
    <!-- script.js file -->
    <script src="script.js"></script>
</body>
</html>
